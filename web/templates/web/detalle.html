<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ post.titulo }}</title>
</head>
<body>
    <a href="{% url 'web:inicio' %}">Volver al inicio</a>

    <h1>{{ post.titulo }}</h1>
    <p><strong>Autor:</strong> {{ post.autor.nombre }}</p>
    <p><strong>Estado:</strong> {{ post.estado }}</p>
    <p>{{ post.contenido|default:"Contenido todavía no cargado." }}</p>

    <h2>Etiquetas</h2>
    <ul>
        {% for tag in post.tags %}
            <li>{{ tag }}</li>
        {% empty %}
            <li>Este post no tiene etiquetas.</li>
        {% endfor %}
    </ul>
</body>
</html>
