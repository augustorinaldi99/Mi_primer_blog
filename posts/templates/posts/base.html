{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Primer Blog</title>
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>
    <header>
        <h1>Mi Primer Blog</h1>
        <!-- Navegación compartida por todas las páginas que heredan esta base. -->
        <nav>
            <a href="{% url 'posts:inicio' %}">Inicio</a>
            <a href="{% url 'posts:acerca' %}">Acerca de</a>

            {% if user.is_authenticated %}
                <a href="{% url 'accounts:perfil' %}">Mi perfil</a>
                <a href="{% url 'posts:gestion_posts' %}">Gestión</a>
                <a href="{% url 'posts:crear_post' %}">Crear post</a>
                {% if user.is_staff %}
                    <a href="{% url 'admin:index' %}">Administración</a>
                {% endif %}
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Cerrar sesión</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Iniciar sesión</a>
                <a href="{% url 'accounts:registro' %}">Crear cuenta</a>
            {% endif %}
        </nav>
    </header>

    <!-- Cada plantilla hija coloca su contenido dentro de este bloque. -->
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
