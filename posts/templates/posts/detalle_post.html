{% extends 'posts/base.html' %}

{% block content %}
    <!-- El detalle muestra el contenido completo del post seleccionado. -->
    <article>
        <h2>{{ post.titulo }}</h2>
        <p>Autor: {{ post.autor }}</p>
        <p>{{ post.contenido|linebreaksbr }}</p>
    </article>

    <a href="{% url 'posts:inicio' %}">Volver a publicaciones</a>
{% endblock %}
