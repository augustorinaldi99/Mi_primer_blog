{% extends 'posts/base.html' %}

{% block content %}
    <!-- El detalle muestra el contenido completo del post seleccionado. -->
    <article>
        <h2>{{ post.titulo }}</h2>
        <p>Autor: {{ post.autor }}</p>
        <p>Estado: {{ post.get_estado_display }}</p>
        <p class="contenido-post">{{ post.contenido|linebreaksbr }}</p>
        <!-- La imagen es opcional: solo se consulta su URL si existe. -->
        {% if post.imagen %}
            <img class="imagen-post" src="{{ post.imagen.url }}" alt="Imagen de {{ post.titulo }}">
        {% endif %}
    </article>

    <a href="{% url 'posts:inicio' %}">Volver a publicaciones</a>
{% endblock %}
