{% extends 'posts/base.html' %}

{% block content %}
    <h2>Eliminar publicación</h2>
    <p>¿Estás seguro de que querés eliminar "{{ post.titulo }}"?</p>

    <!-- Abrir esta página no borra nada: la eliminación requiere enviar el POST. -->
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <a href="{% url 'posts:gestion_posts' %}">Cancelar</a>
{% endblock %}
