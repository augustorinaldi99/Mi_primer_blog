{% with etiquetas=post.etiquetas_ordenadas.all %}
    {% if etiquetas %}
        <div class="tag-list" aria-label="Tags de la publicación">
            {% for etiqueta in etiquetas %}
                <a class="tag" href="{% url 'posts:posts_por_tag' etiqueta.tag.id %}">{{ etiqueta.tag.nombre }}</a>
            {% endfor %}
        </div>
    {% else %}
        <p class="no-tags">Este post aún no contiene tags.</p>
    {% endif %}
{% endwith %}
