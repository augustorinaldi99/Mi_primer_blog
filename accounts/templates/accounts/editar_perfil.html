{% extends "posts/base.html" %}

{% block content %}
    <h2>Editar perfil</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar cambios</button>
    </form>
    <p><a href="{% url 'accounts:perfil' %}">Volver a mi perfil</a></p>
{% endblock %}
