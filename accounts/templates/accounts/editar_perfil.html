{% extends "posts/base.html" %}

{% block title %}Editar perfil · Mi Primer Blog{% endblock %}

{% block content %}
    <div class="page-heading narrow">
        <p class="eyebrow">Tu cuenta</p>
        <h1>Editar perfil</h1>
    </div>
    <form class="form-panel narrow" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit">Guardar cambios</button>
            <a href="{% url 'accounts:perfil' %}">Cancelar</a>
        </div>
    </form>
{% endblock %}
