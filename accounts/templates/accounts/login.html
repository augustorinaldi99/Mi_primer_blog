{% extends 'posts/base.html' %}

{% block title %}Iniciar sesión · Mi Primer Blog{% endblock %}

{% block content %}
    <div class="page-heading narrow">
        <p class="eyebrow">Bienvenido de nuevo</p>
        <h1>Iniciar sesión</h1>
    </div>
    <form class="form-panel narrow" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Entrar</button>
        <p class="form-note">¿Todavía no tenés cuenta? <a href="{% url 'accounts:registro' %}">Registrate</a>.</p>
    </form>
{% endblock %}
